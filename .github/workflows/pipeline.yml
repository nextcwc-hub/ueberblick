name: Nachrichten aktualisieren

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Bisherige Daten holen
        run: |
          git clone --depth 1 --branch data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" out || mkdir -p out
          rm -rf out/.git

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Pipeline
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          WRITER_MODEL: ${{ vars.WRITER_MODEL }}
          CLUSTER_MODEL: ${{ vars.CLUSTER_MODEL }}
          MAX_WRITES_PER_RUN: ${{ vars.MAX_WRITES_PER_RUN }}
          MAX_WRITES_PER_DAY: ${{ vars.MAX_WRITES_PER_DAY }}
        run: python pipeline.py ../out

      - name: Veröffentlichen
        working-directory: out
        run: |
          git init -q -b data
          git config user.name "ueberblick-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Update $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      # GitHubs Zeitplan startet oft verspätet oder gar nicht – deshalb plant jeder Lauf den nächsten selbst.
      - name: Nächsten Lauf planen
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 600
          waiting=$(gh run list -R "${{ github.repository }}" -w pipeline.yml --json status --jq '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting")] | length')
          if [ "$waiting" = "0" ]; then gh workflow run pipeline.yml -R "${{ github.repository }}" --ref main; fi
